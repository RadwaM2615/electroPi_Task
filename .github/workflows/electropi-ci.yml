name: Electro Pi - API & UI Tests

# API tests gate every change; UI tests start only if the API suite passes.
# Here the "deployed test environment" is the local mock app (mock-app/server.js).
# For a real deployment, replace the "Start mock app" step with your deploy job,
# set ELECTROPI_BASE_URL, and store credentials as repository secrets.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # nightly full run
  workflow_dispatch:

concurrency:
  group: electropi-${{ github.ref }}
  cancel-in-progress: true

env:
  MOCK_PORT: 3100
  # Empty secrets fall back to the mock app's demo users (data/users.json)
  ADMIN_EMAIL: ${{ secrets.ELECTROPI_ADMIN_EMAIL }}
  ADMIN_PASSWORD: ${{ secrets.ELECTROPI_ADMIN_PASSWORD }}

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTROPI_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start mock app
        run: |
          node mock-app/server.js > mock-app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$ELECTROPI_BASE_URL/health" && exit 0
            sleep 1
          done
          echo "Mock app did not start"; cat mock-app.log; exit 1

      - name: Playwright API tests
        run: npx playwright test tests/api

      - name: Upload API results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-results
          path: |
            results/
            playwright-report/
          retention-days: 14

  ui-tests:
    needs: api-tests # skip UI time if the API is broken
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright's webServer config starts the mock app for this job
      - name: Playwright UI tests
        run: npx playwright test tests/ui --shard=${{ matrix.shard }}/2 --pass-with-no-tests

      - name: Upload UI results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-results-shard-${{ matrix.shard }}
          path: |
            results/
            playwright-report/
            test-results/
          retention-days: 14
